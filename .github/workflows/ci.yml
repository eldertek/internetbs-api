name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test tools in isolated venv
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip "setuptools>=84.1.0" wheel setuptools_scm requests pytest pip-audit
          .venv/bin/python -m pip install --no-build-isolation --no-deps -e .

      - name: Run unit tests
        run: .venv/bin/pytest tests/test_security_timeouts.py -v

      - name: Audit Python dependencies
        if: matrix.python-version == '3.12'
        run: .venv/bin/pip-audit --skip-editable
